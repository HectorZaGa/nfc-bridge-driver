name: Build Multi-Arch Driver (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Driver version override (defaults to Cargo.toml version)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

jobs:
  build-driver:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain & targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Ensure LLVM clang (for ARM64 ring) and Inno Setup 6
        shell: pwsh
        run: |
          if (-not (Get-Command clang.exe -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files\LLVM\bin\clang.exe") {
              "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            } else {
              choco install llvm -y --no-progress
              "C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          if (-not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
          "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Determine Version
        id: ver
        shell: pwsh
        run: |
          $cargoToml = Get-Content "Cargo.toml" -Raw
          $cargoVer = ([regex]::Match($cargoToml, '(?m)^version\s*=\s*"([^"]+)"')).Groups[1].Value
          if ("${{ github.ref }}" -like "refs/tags/v*") {
            $v = ("${{ github.ref_name }}".TrimStart('v') -split '-')[0]
          } elseif ("${{ github.event.inputs.version }}".Trim()) {
            $v = "${{ github.event.inputs.version }}".Trim()
          } else {
            $v = $cargoVer
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Run Driver Unit & Integration Tests
        shell: pwsh
        run: cargo test

      - name: Build x64, x86, ARM64 Driver binaries & Inno Installers
        shell: pwsh
        run: |
          $Version = "${{ steps.ver.outputs.version }}"
          $Root = (Get-Location).Path
          $OutDir = Join-Path $Root "target\packages"
          New-Item -ItemType Directory -Path $OutDir -Force | Out-Null

          $IssPath = Join-Path $Root "packaging\nfc-bridge.iss"
          $SetupIcon = Join-Path $Root "assets\icons\setup.ico"
          $UninstallIcon = Join-Path $Root "assets\icons\uninstall.ico"
          $Iscc = (Get-Command ISCC.exe).Source

          $Targets = @(
            @{ Arch = "x64";   Triple = "x86_64-pc-windows-msvc" },
            @{ Arch = "x86";   Triple = "i686-pc-windows-msvc" },
            @{ Arch = "arm64"; Triple = "aarch64-pc-windows-msvc" }
          )

          $Payloads = @{}
          foreach ($t in $Targets) {
            cargo build --release --target $t.Triple --bin nfc-bridge-driver
            if ($LASTEXITCODE -ne 0) { throw "Failed building driver for $($t.Triple)" }
            $exe = Join-Path $Root "target\$($t.Triple)\release\nfc-bridge-driver.exe"
            $Payloads[$t.Arch] = $exe

            & $Iscc "/Q" `
              "/DProductSlug=driver" `
              "/DAppVersion=$Version" `
              "/DArch=$($t.Arch)" `
              "/DUniversalMode=0" `
              "/DPayloadExe=$exe" `
              "/DSetupIcon=$SetupIcon" `
              "/DUninstallIcon=$UninstallIcon" `
              "/DOutputDir=$OutDir" `
              "/DOutputBaseFilename=nfc-bridge-driver-$Version-windows-$($t.Arch)-setup" `
              $IssPath
            if ($LASTEXITCODE -ne 0) { throw "Failed ISCC for $($t.Arch)" }
          }

          # Universal Setup (x64 / x86 / ARM64)
          & $Iscc "/Q" `
            "/DProductSlug=driver" `
            "/DAppVersion=$Version" `
            "/DUniversalMode=1" `
            "/DPayloadExeX64=$($Payloads['x64'])" `
            "/DPayloadExeX86=$($Payloads['x86'])" `
            "/DPayloadExeArm64=$($Payloads['arm64'])" `
            "/DSetupIcon=$SetupIcon" `
            "/DUninstallIcon=$UninstallIcon" `
            "/DOutputDir=$OutDir" `
            "/DOutputBaseFilename=nfc-bridge-driver-$Version-windows-setup" `
            $IssPath
          if ($LASTEXITCODE -ne 0) { throw "Failed Universal ISCC build" }

          $sums = Get-ChildItem -Path $OutDir -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Sort-Object Name | ForEach-Object {
            $hash = (Get-FileHash -Path $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          [System.IO.File]::WriteAllLines((Join-Path $OutDir "SHA256SUMS.txt"), $sums, [System.Text.UTF8Encoding]::new($false))

      # Placeholder para firma con SignPath Foundation una vez aprobada la organización:
      # Añadir submit-signing-request (signpath/github-action-submit-signing-request) con ${{ secrets.SIGNPATH_API_TOKEN }}.

      - name: Upload Driver Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nfc-bridge-driver-${{ steps.ver.outputs.version }}
          path: target/packages/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: target/packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
