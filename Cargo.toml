[package]
name = "nfc-bridge-driver"
version = "0.1.0"
edition = "2021"
authors = ["Hector Zarate <HectorZaGa96@hotmail.com>"]
description = "Ultra-low latency NFC bridge background driver and PC/SC emulator for Windows"

[dependencies]
tokio = { version = "1.41", features = ["full"] }
bytes = "1.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ctrlc = "3.4"
rusb = { version = "0.9.4", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Memory",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
